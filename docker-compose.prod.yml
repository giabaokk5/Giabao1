version: "3.9"

services:
  api:
    image: docker.io/${DOCKER_USER:-giabaokk5}/${IMAGE_NAME:-htcd-shop}:latest
    container_name: htcd-shop-app
    restart: always
    ports:
      - "${APP_PORT:-3007}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-htcd_shop_jwt_secret_production_2026}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@htcdshop.local}
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./data:/app/server/data
    env_file:
      - .env
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
